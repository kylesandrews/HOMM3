name: Build portable Monterey Intel innoextract
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-intel-innoextract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - name: Install build dependencies on GitHub runner
        run: |
          brew install boost xz cmake
      - name: Download and verify official innoextract source
        run: |
          curl -fsSL --retry 3 -o innoextract-1.9.tar.gz https://constexpr.org/innoextract/files/innoextract-1.9.tar.gz
          echo "6344a69fc1ed847d4ed3e272e0da5998948c6b828cb7af39c6321aba6cf88126  innoextract-1.9.tar.gz" | shasum -a 256 -c -
          tar xzf innoextract-1.9.tar.gz
          # innoextract v1.9 calls cmake -P to generate version/man-page files.
          # Those subprocesses do not inherit CMAKE_POLICY_VERSION_MINIMUM and
          # fail with CMake 4's removal of compatibility before 3.5.
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path("innoextract-1.9/cmake").rglob("*.cmake"))
          for p in files:
              old = p.read_text()
              new = re.sub(r"cmake_minimum_required\(VERSION\s+[0-9.]+(?:\.\.\.[0-9.]+)?\)", "cmake_minimum_required(VERSION 3.5)", old)
              if new != old:
                  p.write_text(new)
                  print("Updated old CMake policy minimum:",p)
          PY
          # Boost 1.92 no longer transitively includes directory_iterator in
          # filesystem/operations.hpp. Upstream innoextract 1.9 predates this.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("innoextract-1.9/src/stream/slice.cpp")
          text = path.read_text()
          original = "#include <boost/filesystem/operations.hpp>"
          assert text.count(original) == 1
          path.write_text(text.replace(original,
              original + "\\n#include <boost/filesystem/directory.hpp>"))
          PY
      - name: Configure macOS 12 x86_64 compatible standalone extractor
        run: |
          cmake -S innoextract-1.9 -B innoextract-1.9/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix boost);$(brew --prefix xz)" \
            -DBoost_USE_STATIC_LIBS=ON \
            -DLZMA_USE_STATIC_LIBS=ON \
            -DUSE_LTO=OFF -DSET_WARNING_FLAGS=OFF \
            -DCMAKE_CXX_FLAGS="-mmacosx-version-min=12.0" \
            -DCMAKE_EXE_LINKER_FLAGS="-mmacosx-version-min=12.0"
      - name: Compile innoextract
        run: cmake --build innoextract-1.9/build --parallel 4
      - name: Verify executable is portable to macOS Monterey
        run: |
          EXE="$(find innoextract-1.9/build -type f -name innoextract -perm +111 | head -1)"
          test -f "$EXE"
          file "$EXE"
          otool -L "$EXE"
          otool -l "$EXE" | grep -A 5 LC_BUILD_VERSION
          "$EXE" --version
          mkdir -p portable-innoextract
          cp "$EXE" portable-innoextract/innoextract
          cp innoextract-1.9/LICENSE portable-innoextract/INNOEXTRACT-LICENSE.txt
          python3 - <<'PY'
          import subprocess, pathlib, re
          exe = pathlib.Path('portable-innoextract/innoextract')
          f = subprocess.check_output(['file',str(exe)], text=True)
          assert 'x86_64' in f, f
          deps = subprocess.check_output(['otool','-L',str(exe)],text=True)
          non_system = [line for line in deps.splitlines()[1:] if line.strip() and not line.strip().startswith(('/usr/lib/','/System/Library/'))]
          assert not non_system, 'Extractor needs external libraries: '+str(non_system)
          data = subprocess.check_output(['otool','-l',str(exe)],text=True)
          matches = re.findall(r'cmd LC_BUILD_VERSION\s+cmdsize \d+\s+platform \d+\s+minos (\d+)\.(\d+)', data)
          assert matches, 'Missing LC_BUILD_VERSION minos'
          assert all((int(a),int(b)) <= (12,0) for a,b in matches), f'Target exceeds Monterey: {matches}'
          print('Standalone x86_64 binary, system libraries only, macOS deployment target <=12.0')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portable-innoextract-macos12-x86_64
          path: portable-innoextract/
          if-no-files-found: error
