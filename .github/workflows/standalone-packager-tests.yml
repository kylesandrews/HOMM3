name: Verify standalone iOS packager
on:
  push:
    branches: [main]
    paths: ['.github/workflows/standalone-packager-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-packager-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout standalone packager source
        uses: actions/checkout@v4
        with:
          ref: ios-native-port
      - name: Python syntax
        run: python3 -m py_compile ios-native/standalone/pack_standalone.py ios-native/standalone/test_packaging.py
      - name: GOG extraction helper syntax
        run: bash -n ios-native/standalone/prepare_gog.sh ios-native/standalone/build_personal_ipa.sh "ios-native/standalone/Build Private IPA.command"
      - name: Offline packaging test suite
        working-directory: ios-native/standalone
        run: python3 -m unittest -v test_packaging.py
      - name: Assert no original assets included
        run: |
          ! find ios-native/standalone -type f \( -iname '*.lod' -o -iname '*.h3m' -o -iname '*.h3c' -o -iname '*.bin' -o -iname '*.exe' \) | grep .
