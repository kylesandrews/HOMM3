name: Build Heroes III Mobile native iOS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heroes-mobile-native-ios.yml'
  workflow_dispatch:
    inputs:
      vcmi_revision:
        description: Pinned VCMI source revision
        required: true
        default: bae8bafd2ec3bbf7ec2cacea5c6868ed3b019405
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-native-port
      - name: Fetch upstream sources and verify modified UI
        run: |
          git clone --filter=blob:none https://github.com/vcmi/vcmi.git vcmi-src
          git -C vcmi-src checkout --detach '${{ inputs.vcmi_revision || 'bae8bafd2ec3bbf7ec2cacea5c6868ed3b019405' }}'
          cp ios-native/overrides/client/adventureMap/AdventureMapWidget.cpp vcmi-src/client/adventureMap/AdventureMapWidget.cpp
          cp ios-native/overrides/config/widgets/adventureMap.json vcmi-src/config/widgets/adventureMap.json
          python3 ios-native/verify_patch.py vcmi-src
          git -C vcmi-src diff --check
          echo "VCMI native iOS customization validated"
          echo "## Heroes III Mobile v0.8: non-overlapping adventure dock" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated dock geometry, iOS-only map viewport reservation, and all six native controls." >> "$GITHUB_STEP_SUMMARY"
  build-native-ios:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios-native-port
      - name: Install Xcode build prerequisites
        run: |
          xcodebuild -version
          brew install cmake conan
          conan --version
      - name: Clone VCMI and pinned submodules
        run: |
          git clone --recurse-submodules https://github.com/vcmi/vcmi.git vcmi-src
          git -C vcmi-src checkout --detach '${{ inputs.vcmi_revision || 'bae8bafd2ec3bbf7ec2cacea5c6868ed3b019405' }}'
          git -C vcmi-src submodule update --init --recursive
      - name: Apply native iOS overrides
        run: |
          cp ios-native/overrides/client/adventureMap/AdventureMapWidget.cpp vcmi-src/client/adventureMap/AdventureMapWidget.cpp
          cp ios-native/overrides/config/widgets/adventureMap.json vcmi-src/config/widgets/adventureMap.json
          python3 ios-native/verify_patch.py vcmi-src
          git -C vcmi-src diff --check
          git -C vcmi-src diff > native-ios-customizations.diff
      - name: Restore official VCMI iOS dependency cache
        working-directory: vcmi-src
        run: |
          curl --fail --location --retry 3 --output dependencies-ios.txz \
            https://github.com/vcmi/vcmi-dependencies/releases/download/2026-10-13/dependencies-ios.txz
          conan cache restore dependencies-ios.txz
          rm dependencies-ios.txz
      - name: Resolve iOS dependencies
        working-directory: vcmi-src
        run: |
          conan profile detect --force
          conan install . --output-folder=conan-generated --build=never \
            --profile=dependencies/conan_profiles/ios-arm64 \
            --profile=dependencies/conan_profiles/base/apple-system \
            -s '&:build_type=Debug'
      - name: Configure Xcode project (unsigned)
        working-directory: vcmi-src
        run: |
          cmake --preset ios-device-conan -B out/build/ios-device-conan \
            -D BUNDLE_IDENTIFIER_PREFIX=com.heroes3.mobileci \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
      - name: Compile modified VCMI
        working-directory: vcmi-src
        run: |
          cmake --build out/build/ios-device-conan --target vcmiclient --config Debug -- -quiet CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned iOS app and IPA
        run: |
          APP="vcmi-src/out/build/ios-device-conan/bin/Debug/vcmiclient.app"
          test -f "$APP/vcmiclient"
          test -f "$APP/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" vcmi-ios-unsigned-app.zip
          mkdir -p ipa-staging/Payload
          ditto "$APP" ipa-staging/Payload/vcmiclient.app
          (cd ipa-staging && ditto -c -k --sequesterRsrc --keepParent Payload ../vcmi-ios-unsigned.ipa)
          python3 ios-native/verify_ipa.py vcmi-ios-unsigned.ipa
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          src = Path("ios-native/overrides/config/widgets/adventureMap.json").read_bytes()
          with zipfile.ZipFile("vcmi-ios-unsigned.ipa") as bundle:
              packaged = bundle.read("Payload/vcmiclient.app/config/widgets/adventureMap.json")
          assert packaged == src, "Bundled adventureMap.json does not match this source revision"
          print("Verified: IPA includes the current, exact mobile adventure layout")
          PY
          shasum -a 256 vcmi-ios-unsigned.ipa > vcmi-ios-unsigned.sha256
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          ipa = Path("vcmi-ios-unsigned.ipa")
          manifest = {
              "project": "Heroes III Mobile (unofficial)",
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "upstream_vcmi": subprocess.check_output(["git", "-C", "vcmi-src", "rev-parse", "HEAD"], text=True).strip(),
              "target": "iPhoneOS-arm64",
              "unsigned": True,
              "original_game_assets_included": False,
              "ipa_sha256": hashlib.sha256(ipa.read_bytes()).hexdigest(),
          }
          Path("vcmi-ios-buildinfo.json").write_text(json.dumps(manifest, indent=2) + "\\n")
          print(json.dumps(manifest, indent=2))
          PY
          ls -lh vcmi-ios-unsigned.ipa vcmi-ios-unsigned-app.zip
      - name: Upload native patch and app build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heroes-iii-ios-native-build
          path: |
            native-ios-customizations.diff
            vcmi-ios-unsigned-app.zip
            vcmi-ios-unsigned.ipa
            vcmi-ios-unsigned.sha256
            vcmi-ios-buildinfo.json
          if-no-files-found: warn
